name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - _config.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare single-source Markdown site
        shell: bash
        run: |
          mkdir -p _pages_src
          cp _config.yml _pages_src/_config.yml
          {
            printf '%s\n' '---' 'layout: default' 'title: Awesome FoloToy AI Passport' '---' ''
            cat README.md
          } > _pages_src/index.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages_src
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
